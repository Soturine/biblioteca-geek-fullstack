<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">DER - Biblioteca Geek</title>
  <desc id="desc">Diagrama entidade-relacionamento do banco MySQL do projeto Biblioteca Geek.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 800 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #475569; }
      .entity { fill: #ffffff; stroke: #1d4ed8; stroke-width: 3; rx: 10; }
      .head { fill: #0f172a; }
      .headText { font: 800 22px Arial, sans-serif; fill: #ffffff; }
      .field { font: 500 18px Arial, sans-serif; fill: #0f172a; }
      .pk { fill: #1d4ed8; font-weight: 800; }
      .fk { fill: #7c3aed; font-weight: 800; }
      .line { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .small { font: 500 16px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100" />
  <text x="800" y="55" text-anchor="middle" class="title">DER - Biblioteca Geek</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">Modelo relacional MySQL: usuários, autores, categorias, livros, empréstimos, itens de empréstimo e reservas</text>

  <!-- Usuários -->
  <g transform="translate(70,130)">
    <rect class="entity" width="285" height="265" />
    <path class="head" d="M10,0 h265 a10,10 0 0 1 10,10 v45 h-285 v-45 a10,10 0 0 1 10,-10" />
    <text x="142" y="36" text-anchor="middle" class="headText">usuarios</text>
    <text x="22" y="85" class="field pk">PK  id_usuario</text>
    <text x="22" y="115" class="field">nome</text>
    <text x="22" y="145" class="field">email UNIQUE</text>
    <text x="22" y="175" class="field">senha_hash</text>
    <text x="22" y="205" class="field">perfil</text>
    <text x="22" y="235" class="field">criado_em</text>
  </g>

  <!-- Autores -->
  <g transform="translate(660,130)">
    <rect class="entity" width="285" height="165" />
    <path class="head" d="M10,0 h265 a10,10 0 0 1 10,10 v45 h-285 v-45 a10,10 0 0 1 10,-10" />
    <text x="142" y="36" text-anchor="middle" class="headText">autores</text>
    <text x="22" y="85" class="field pk">PK  id_autor</text>
    <text x="22" y="115" class="field">nome</text>
    <text x="22" y="145" class="field">nacionalidade</text>
  </g>

  <!-- Categorias -->
  <g transform="translate(1245,130)">
    <rect class="entity" width="285" height="135" />
    <path class="head" d="M10,0 h265 a10,10 0 0 1 10,10 v45 h-285 v-45 a10,10 0 0 1 10,-10" />
    <text x="142" y="36" text-anchor="middle" class="headText">categorias</text>
    <text x="22" y="85" class="field pk">PK  id_categoria</text>
    <text x="22" y="115" class="field">nome UNIQUE</text>
  </g>

  <!-- Livros -->
  <g transform="translate(650,410)">
    <rect class="entity" width="310" height="340" />
    <path class="head" d="M10,0 h290 a10,10 0 0 1 10,10 v45 h-310 v-45 a10,10 0 0 1 10,-10" />
    <text x="155" y="36" text-anchor="middle" class="headText">livros</text>
    <text x="22" y="85" class="field pk">PK  id_livro</text>
    <text x="22" y="115" class="field">titulo</text>
    <text x="22" y="145" class="field">ano</text>
    <text x="22" y="175" class="field">quantidade</text>
    <text x="22" y="205" class="field">imagem</text>
    <text x="22" y="235" class="field">paginas</text>
    <text x="22" y="265" class="field">sinopse</text>
    <text x="22" y="295" class="field">editora</text>
    <text x="172" y="85" class="field">isbn</text>
    <text x="172" y="115" class="field fk">FK  id_autor</text>
    <text x="172" y="145" class="field fk">FK  id_categoria</text>
  </g>

  <!-- Empréstimos -->
  <g transform="translate(70,620)">
    <rect class="entity" width="300" height="245" />
    <path class="head" d="M10,0 h280 a10,10 0 0 1 10,10 v45 h-300 v-45 a10,10 0 0 1 10,-10" />
    <text x="150" y="36" text-anchor="middle" class="headText">emprestimos</text>
    <text x="22" y="85" class="field pk">PK  id_emprestimo</text>
    <text x="22" y="115" class="field fk">FK  id_usuario</text>
    <text x="22" y="145" class="field">nome_leitor</text>
    <text x="22" y="175" class="field">data_emprestimo</text>
    <text x="22" y="205" class="field">data_devolucao</text>
    <text x="22" y="235" class="field">status</text>
  </g>

  <!-- Reservas -->
  <g transform="translate(520,820)">
    <rect class="entity" width="330" height="230" />
    <path class="head" d="M10,0 h310 a10,10 0 0 1 10,10 v45 h-330 v-45 a10,10 0 0 1 10,-10" />
    <text x="165" y="36" text-anchor="middle" class="headText">reservas</text>
    <text x="22" y="85" class="field pk">PK  id_reserva</text>
    <text x="22" y="115" class="field fk">FK  id_usuario</text>
    <text x="22" y="145" class="field fk">FK  id_livro</text>
    <text x="22" y="175" class="field">data_reserva</text>
    <text x="22" y="205" class="field">data_prevista_retirada</text>
    <text x="200" y="85" class="field">status</text>
    <text x="200" y="115" class="field">observacao</text>
  </g>

  <!-- Itens de empréstimo -->
  <g transform="translate(1210,760)">
    <rect class="entity" width="315" height="200" />
    <path class="head" d="M10,0 h295 a10,10 0 0 1 10,10 v45 h-315 v-45 a10,10 0 0 1 10,-10" />
    <text x="157" y="36" text-anchor="middle" class="headText">itens_emprestimo</text>
    <text x="22" y="85" class="field pk">PK  id_item</text>
    <text x="22" y="115" class="field fk">FK  id_emprestimo</text>
    <text x="22" y="145" class="field fk">FK  id_livro</text>
    <text x="22" y="175" class="field">quantidade</text>
  </g>

  <!-- Relações -->
  <!-- usuarios -> emprestimos -->
  <path class="line" d="M212,395 L212,620" />
  <text x="225" y="430" class="label">1</text>
  <text x="225" y="610" class="label">N</text>
  <text x="238" y="515" class="label">realiza</text>

  <!-- usuarios -> reservas -->
  <path class="line" d="M355,330 L430,330 L430,935 L520,935" />
  <text x="370" y="315" class="label">1</text>
  <text x="500" y="918" class="label">N</text>
  <text x="445" y="705" class="label">cria reserva</text>

  <!-- autores -> livros -->
  <path class="line" d="M802,295 L802,410" />
  <text x="818" y="325" class="label">1</text>
  <text x="818" y="402" class="label">N</text>
  <text x="835" y="360" class="label">escreve</text>

  <!-- categorias -> livros -->
  <path class="line" d="M1388,265 L1388,390 L960,390 L960,495" />
  <text x="1400" y="290" class="label">1</text>
  <text x="975" y="485" class="label">N</text>
  <text x="1120" y="375" class="label">classifica</text>

  <!-- emprestimos -> itens -->
  <path class="line" d="M370,850 L1040,850 L1040,930 L1210,930" />
  <text x="385" y="835" class="label">1</text>
  <text x="1190" y="915" class="label">N</text>
  <text x="740" y="835" class="label">possui item</text>

  <!-- livros -> itens -->
  <path class="line" d="M960,650 L1080,650 L1080,835 L1210,835" />
  <text x="980" y="635" class="label">1</text>
  <text x="1190" y="820" class="label">N</text>
  <text x="1088" y="740" class="label">aparece em item</text>

  <!-- livros -> reservas -->
  <path class="line" d="M650,675 L610,675 L610,820" />
  <text x="625" y="663" class="label">1</text>
  <text x="625" y="808" class="label">N</text>
  <text x="505" y="750" class="label">é reservado em</text>

  <!-- Legenda -->
  <g transform="translate(70,930)">
    <rect class="card" width="330" height="125" />
    <text x="20" y="32" class="label">Legenda</text>
    <text x="20" y="65" class="small"><tspan class="pk">PK</tspan>  Chave primária</text>
    <text x="20" y="92" class="small"><tspan class="fk">FK</tspan>  Chave estrangeira</text>
    <text x="20" y="119" class="small">1:N  Um registro relacionado a muitos</text>
  </g>
</svg>
