<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">JSON</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Importação e exportação JSON</h1>
      </div>
      <div id="alertJson"></div>
      <div class="row g-3">
        <div class="col-md-6">
          <section class="panel">
            <div class="panel-header">Exportar</div>
            <div class="panel-body">
              <div class="mb-3">
                <label class="form-label" for="entidadeExportar">Entidade</label>
                <select class="form-select" id="entidadeExportar">
                  <option value="autores">Autores</option>
                  <option value="categorias">Categorias</option>
                  <option value="livros">Livros</option>
                  <option value="emprestimos">Empréstimos</option>
                </select>
              </div>
              <button class="btn btn-primary" id="btnExportarJson" type="button">
                Exportar JSON
              </button>
            </div>
          </section>
        </div>
        <div class="col-md-6">
          <section class="panel">
            <div class="panel-header">Importar</div>
            <div class="panel-body">
              <div class="mb-3">
                <label class="form-label" for="entidadeImportar">Entidade</label>
                <select class="form-select" id="entidadeImportar">
                  <option value="autores">Autores</option>
                  <option value="categorias">Categorias</option>
                  <option value="livros">Livros</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="arquivoJson">Arquivo</label>
                <input
                  class="form-control"
                  type="file"
                  id="arquivoJson"
                  accept="application/json,.json"
                />
              </div>
              <button class="btn btn-success" id="btnImportarJson" type="button">
                Importar JSON
              </button>
              <pre
                class="bg-light border rounded p-2 mt-3 small mb-0 d-none"
                id="detalhesImportacaoJson"
              ></pre>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/import_export.js"></script>
  </body>
</html>
