<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logs XML | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">Logs XML</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Logs XML</h1>
      </div>
      <div id="alertLogs"></div>
      <section class="panel">
        <div class="panel-header">Filtros</div>
        <div class="panel-body">
          <form class="row g-3 align-items-end" id="formLogs">
            <div class="col-md-3">
              <label class="form-label" for="usuarioLog">Usuário</label>
              <input class="form-control" type="text" id="usuarioLog" placeholder="admin" />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="tipoLog">Tipo</label>
              <select class="form-select" id="tipoLog">
                <option value="">Todos</option>
                <option value="REQUEST">REQUEST</option>
                <option value="BUSINESS">BUSINESS</option>
                <option value="ERROR">ERROR</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="dataInicioLog">Início</label>
              <input class="form-control" type="date" id="dataInicioLog" />
            </div>
            <div class="col-md-2">
              <label class="form-label" for="dataFimLog">Fim</label>
              <input class="form-control" type="date" id="dataFimLog" />
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" type="submit">Baixar XML</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/logs.js"></script>
  </body>
</html>
