<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relatório | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">Relatório</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Relatório de livros</h1>
        <button class="btn btn-primary" type="button" id="btnGerarPdf">Gerar PDF</button>
      </div>
      <div id="alertRelatorio"></div>
      <section class="panel mb-3">
        <div class="panel-body">
          <form class="row g-2 align-items-end" id="formRelatorio">
            <div class="col-md-6">
              <label class="form-label" for="categoriaRelatorio">Categoria</label>
              <select class="form-select" id="categoriaRelatorio">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-md-auto">
              <button class="btn btn-outline-primary" type="submit">Filtrar</button>
            </div>
          </form>
        </div>
      </section>
      <section class="panel">
        <div class="panel-header">Livros</div>
        <div class="panel-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Autor</th>
                  <th>Categoria</th>
                  <th>Ano</th>
                  <th>Páginas</th>
                  <th>Quantidade</th>
                </tr>
              </thead>
              <tbody id="tbodyRelatorio"></tbody>
            </table>
          </div>
          <p class="mb-0 fw-bold">
            Total: <span id="totalRelatorio">0</span> livros |
            <span id="totalPaginasRelatorio">0</span> páginas
          </p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/relatorio.js"></script>
  </body>
</html>
