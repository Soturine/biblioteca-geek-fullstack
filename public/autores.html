<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autores | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">Autores</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Autores</h1>
      </div>
      <div id="alertAutores"></div>
      <div class="row g-3">
        <div class="col-lg-4">
          <section class="panel">
            <div class="panel-header" id="tituloFormAutor">Novo autor</div>
            <div class="panel-body">
              <form id="formAutor" novalidate>
                <input type="hidden" id="idAutor" />
                <div class="mb-3">
                  <label class="form-label" for="nomeAutor">Nome</label>
                  <input class="form-control" type="text" id="nomeAutor" minlength="3" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="nacionalidadeAutor">Nacionalidade</label>
                  <input class="form-control" type="text" id="nacionalidadeAutor" />
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Salvar</button>
                  <button class="btn btn-outline-secondary" type="button" id="btnLimparAutor">
                    Limpar
                  </button>
                </div>
              </form>
            </div>
          </section>
        </div>
        <div class="col-lg-8">
          <section class="panel">
            <div class="panel-header">Lista</div>
            <div class="panel-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>Nacionalidade</th>
                      <th class="text-end">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyAutores"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/autores.js"></script>
  </body>
</html>
