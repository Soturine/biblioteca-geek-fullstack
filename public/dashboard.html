<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Dashboard</h1>
      </div>
      <div id="alertDashboard"></div>

      <div class="row g-3 mb-3">
        <div class="col-sm-6 col-xl-3">
          <div class="card stat-card border-0 shadow-sm h-100">
            <div class="card-body">
              <span class="text-secondary">Livros</span>
              <strong class="d-block fs-2" id="statLivros">0</strong>
              <small class="text-secondary">Títulos cadastrados</small>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card stat-card border-0 shadow-sm h-100">
            <div class="card-body">
              <span class="text-secondary">Autores</span>
              <strong class="d-block fs-2" id="statAutores">0</strong>
              <small class="text-secondary">Criadores no acervo</small>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card stat-card border-0 shadow-sm h-100">
            <div class="card-body">
              <span class="text-secondary">Categorias</span>
              <strong class="d-block fs-2" id="statCategorias">0</strong>
              <small class="text-secondary">Prateleiras tematicas</small>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card stat-card border-0 shadow-sm h-100">
            <div class="card-body">
              <span class="text-secondary">Empréstimos</span>
              <strong class="d-block fs-2" id="statEmprestimos">0</strong>
              <small class="text-secondary">Movimentações registradas</small>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <section class="panel h-100">
            <div class="panel-header">Livros por categoria</div>
            <div class="panel-body chart-wrap">
              <canvas id="graficoCategorias"></canvas>
            </div>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="panel h-100">
            <div class="panel-header">Últimos logs</div>
            <div class="panel-body">
              <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Usuário</th>
                      <th>Ação</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyUltimosLogs">
                    <tr>
                      <td colspan="3" class="text-secondary">Carregando...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
