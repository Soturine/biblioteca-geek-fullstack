<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Biblioteca Geek</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page-shell">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
      </ol>
    </nav>
    <div class="page-title">
      <h1>Dashboard</h1>
    </div>
    <div id="alertDashboard"></div>
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="panel stat">
          <div class="panel-body">
            <span class="text-secondary">Livros cadastrados</span>
            <strong class="d-block" id="statLivros">0</strong>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel stat">
          <div class="panel-body">
            <span class="text-secondary">Exemplares disponíveis</span>
            <strong class="d-block" id="statExemplares">0</strong>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel stat">
          <div class="panel-body">
            <span class="text-secondary">Categorias</span>
            <strong class="d-block" id="statCategorias">0</strong>
          </div>
        </div>
      </div>
    </div>
    <section class="panel">
      <div class="panel-header">Livros por categoria</div>
      <div class="panel-body chart-wrap">
        <canvas id="graficoCategorias"></canvas>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
