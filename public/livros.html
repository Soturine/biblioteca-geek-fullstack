<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livros | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">Livros</li>
        </ol>
      </nav>
      <div class="page-title">
        <h1>Livros</h1>
      </div>
      <div id="alertLivros"></div>
      <div class="row g-3">
        <div class="col-lg-4">
          <section class="panel">
            <div class="panel-header" id="tituloFormLivro">Novo livro</div>
            <div class="panel-body">
              <form id="formLivro" novalidate>
                <input type="hidden" id="idLivro" />
                <div class="mb-3">
                  <label class="form-label" for="tituloLivro">Título</label>
                  <input class="form-control" type="text" id="tituloLivro" required />
                </div>
                <div class="row">
                  <div class="col-6 mb-3">
                    <label class="form-label" for="anoLivro">Ano</label>
                    <input class="form-control" type="number" id="anoLivro" min="1900" required />
                  </div>
                  <div class="col-6 mb-3">
                    <label class="form-label" for="quantidadeLivro">Quantidade</label>
                    <input
                      class="form-control"
                      type="number"
                      id="quantidadeLivro"
                      min="0"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-6 mb-3">
                    <label class="form-label" for="paginasLivro">Páginas</label>
                    <input class="form-control" type="number" id="paginasLivro" min="0" value="0" />
                  </div>
                  <div class="col-6 mb-3">
                    <label class="form-label" for="isbnLivro">ISBN</label>
                    <input class="form-control" type="text" id="isbnLivro" maxlength="30" />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="editoraLivro">Editora</label>
                  <input class="form-control" type="text" id="editoraLivro" maxlength="120" />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="sinopseLivro">Sinopse</label>
                  <textarea
                    class="form-control"
                    id="sinopseLivro"
                    rows="3"
                    minlength="10"
                    placeholder="Resumo curto do livro"
                  ></textarea>
                  <div class="form-text">
                    Opcional. Se preenchida, use pelo menos 10 caracteres.
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="autorLivro">Autor</label>
                  <select class="form-select" id="autorLivro" required></select>
                </div>
                <div class="mb-3">
                  <div class="d-flex align-items-center justify-content-between gap-2 mb-1">
                    <label class="form-label mb-0" for="categoriaLivro">Categoria</label>
                    <button
                      class="btn btn-sm btn-outline-primary"
                      type="button"
                      id="btnNovaCategoria"
                    >
                      Nova categoria
                    </button>
                  </div>
                  <select class="form-select" id="categoriaLivro" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="imagemLivro">Capa</label>
                  <input
                    class="form-control"
                    type="file"
                    id="imagemLivro"
                    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                  />
                  <div class="form-text">PNG, JPG, JPEG ou WEBP até 2 MB.</div>
                  <img
                    id="previewImagemLivro"
                    class="cover-thumb mt-2 d-none"
                    alt="Preview da capa"
                  />
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Salvar</button>
                  <button class="btn btn-outline-secondary" type="button" id="btnLimparLivro">
                    Limpar
                  </button>
                </div>
              </form>
            </div>
          </section>
        </div>
        <div class="col-lg-8">
          <section class="panel">
            <div class="panel-header">
              <form class="row g-2 align-items-center" id="formBuscaLivro">
                <div class="col">
                  <input
                    class="form-control"
                    type="search"
                    id="buscaLivro"
                    placeholder="Pesquisar por título"
                  />
                </div>
                <div class="col-auto">
                  <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
                </div>
              </form>
            </div>
            <div class="panel-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>Capa</th>
                      <th>Título</th>
                      <th>Autor</th>
                      <th>Categoria</th>
                      <th>Qtd.</th>
                      <th class="text-end">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="tbodyLivros"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modalDetalhesLivro" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="detalheTitulo">Detalhes do livro</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body" id="detalheLivroConteudo"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalNovaCategoria" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formNovaCategoria" novalidate>
            <div class="modal-header">
              <h2 class="modal-title h5">Nova categoria</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <div id="alertNovaCategoria"></div>
              <label class="form-label" for="nomeNovaCategoria">Nome da categoria</label>
              <input
                class="form-control"
                type="text"
                id="nomeNovaCategoria"
                minlength="2"
                maxlength="100"
                required
              />
              <div class="form-text">Use um nome claro, por exemplo: Fantasia Sombria.</div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button class="btn btn-primary" type="submit">Salvar categoria</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/livros.js"></script>
  </body>
</html>
