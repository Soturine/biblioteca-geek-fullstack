<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Biblioteca Geek</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="login-view">
      <section class="login-card">
        <div class="login-side">
          <h1>Biblioteca Geek</h1>
          <p class="mb-0 text-white-50">Acervo, empréstimos e relatórios em um painel simples.</p>
        </div>
        <div class="login-form-area">
          <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="login-tab"
                data-bs-toggle="tab"
                data-bs-target="#loginPanel"
                type="button"
                role="tab"
              >
                Login
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="register-tab"
                data-bs-toggle="tab"
                data-bs-target="#registerPanel"
                type="button"
                role="tab"
              >
                Cadastro
              </button>
            </li>
          </ul>
          <div id="alertAuth"></div>
          <div class="tab-content">
            <div class="tab-pane fade show active" id="loginPanel" role="tabpanel">
              <form id="formLogin" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="loginEmail">Email</label>
                  <input
                    class="form-control"
                    type="email"
                    id="loginEmail"
                    value="admin@admin.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="loginSenha">Senha</label>
                  <input
                    class="form-control"
                    type="password"
                    id="loginSenha"
                    value="123456"
                    required
                  />
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
              </form>
            </div>
            <div class="tab-pane fade" id="registerPanel" role="tabpanel">
              <form id="formRegister" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="registerNome">Nome</label>
                  <input class="form-control" type="text" id="registerNome" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerEmail">Email</label>
                  <input class="form-control" type="email" id="registerEmail" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerSenha">Senha</label>
                  <input
                    class="form-control"
                    type="password"
                    id="registerSenha"
                    minlength="6"
                    required
                  />
                </div>
                <button class="btn btn-success w-100" type="submit">Criar conta</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
