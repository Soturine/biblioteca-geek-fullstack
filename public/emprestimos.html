<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empréstimos | Biblioteca Geek</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page-shell">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        <li class="breadcrumb-item active" aria-current="page">Empréstimos</li>
      </ol>
    </nav>
    <div class="page-title">
      <h1>Empréstimos</h1>
    </div>
    <div id="alertEmprestimos"></div>
    <div class="row g-3">
      <div class="col-lg-5">
        <section class="panel">
          <div class="panel-header" id="tituloFormEmprestimo">Novo empréstimo</div>
          <div class="panel-body">
            <form id="formEmprestimo">
              <input type="hidden" id="idEmprestimo">
              <div class="mb-3">
                <label class="form-label" for="nomeLeitor">Leitor</label>
                <input class="form-control" type="text" id="nomeLeitor" minlength="3" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="dataDevolucao">Devolução</label>
                  <input class="form-control" type="date" id="dataDevolucao">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="statusEmprestimo">Status</label>
                  <select class="form-select" id="statusEmprestimo">
                    <option value="aberto">Aberto</option>
                    <option value="devolvido">Devolvido</option>
                    <option value="cancelado">Cancelado</option>
                  </select>
                </div>
              </div>
              <div class="row g-2 align-items-end mb-3">
                <div class="col">
                  <label class="form-label" for="livroItem">Livro</label>
                  <select class="form-select" id="livroItem"></select>
                </div>
                <div class="col-3">
                  <label class="form-label" for="quantidadeItem">Qtd.</label>
                  <input class="form-control" type="number" id="quantidadeItem" min="1" value="1">
                </div>
                <div class="col-auto">
                  <button class="btn btn-outline-primary" type="button" id="btnAddItem">Adicionar</button>
                </div>
              </div>
              <div class="border rounded p-2 mb-3 item-list" id="listaItensEmprestimo"></div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Salvar</button>
                <button class="btn btn-outline-secondary" type="button" id="btnLimparEmprestimo">Limpar</button>
              </div>
            </form>
          </div>
        </section>
      </div>
      <div class="col-lg-7">
        <section class="panel">
          <div class="panel-header">Lista</div>
          <div class="panel-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Leitor</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th>Itens</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbodyEmprestimos"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/emprestimos.js"></script>
</body>
</html>
